[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-strategy-bot"
version = "0.1.0"
description = "Smart Money Concepts (SMC) forex strategy backtesting bot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
smc-bot = "smc_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
