[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smc-robot"
version = "1.0.0"
description = "Python AI Smart Money Concepts trading robot for XAUUSDm on MetaTrader 5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
smc-robot = "smc_robot.cli:main"

[tool.setuptools.packages.find]
include = ["smc_robot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
